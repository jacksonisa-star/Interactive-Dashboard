<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>


    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <script defer
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

        <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <h1>My Interactive Dashboard</h1>

    <p>This dashboard was created by Jackson Trinh for the WEB-115 course at Wake Tech</p>

    <script>
        document.write("This dashboard demonstrates how JavaScript can be used to create interactive websites.");
    </script>

    <!-- The <noscript> is for web browsers with JavaScript rendering disabled -->
    <noscript>
        Unfortunately, your browser does not support JavaScript.
    </noscript>

    <div class="container">
        <div class="row">
            <div class="col" id="weekly-tasks">
            <!-- Dashboard Content -->

            <div id="goal-message"></div>

            <form>
                <input type="text" placeholder="Name" id="userName">
                <input type="number" placeholder="Daily Task Goal" id="dailyGoal">
                <input type="number" placeholder="Weekly Bonus Tasks" id="bonusTasks">

                <button type="button" id="goal-btn">Calculate</button>
            </form>

             <script src="js/task-manager.js"></script>
        </div>

        <div class="col" id="metric-converter">
            <h2>Imperial/Metric Converter</h2>

            <form>
                <input type="number" id="input-value" placeholder="Enter value">

                <select id="conversion-type">
                    <option>Inches to Centimeters</option>
                    <option>Feet to Centimeters</option>
                    <option>Yards to Meters</option>
                    <option>Miles to Kilometers</option>
                    <option>Centimeters to Inches</option>   
                    <option>Centimeters to Feet</option>   
                    <option>Meters to Yards</option>          
                    <option>Kilometers to Miles</option>
                </select>

                <button type="button" id="convert-btn">Convert</button>
            </form>

            <div id="conversion-result"></div>

            <script src="js/metric-converter.js" defer></script>
        </div>  

        <div class="col" id="magic-eight-ball">
            <script src="magic-eight-ball.js" defer></script>﻿
            <link rel="stylesheet" href="css/magic-eight-ball.css">

            <h2 class="heading">Magic Eight Ball</h2>

             <form>
              <p>Type a yes/no question below, then click on the Eight Ball below to get your answer!</p>

              <input id="question" name="question" size="80">
              <div id="magicEightBall">
                <div id="circle"></div>
                <img id="ball" src="img/magic-eight-ball.png"/>
              </div>
              <button id="reset" name="reset" type="reset">Ask another question</button>
            </form>
            <br>
        </div>  
    </div>
 </div>

</body>

</html>
